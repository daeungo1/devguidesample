<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="e-title e-desc">
  <title id="e-title">단일 UDR의 ECMP next hop 구성</title>
  <desc id="e-desc">source subnet의 route table에 VirtualApplianceEcmp next hop 타입의 UDR 하나가 있고, 2~16개 appliance IP로 트래픽이 분산된 뒤 목적지로 전달된다. 세션 상태 동기화와 failover는 ECMP가 제공하지 않는다.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#172554;font-size:20px}.h{font-size:26px;font-weight:700}.d{font-size:17px}.box{fill:#f8fafc;stroke:#cbd5e1}.key{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.f{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#a)}</style>
  </defs>
  <rect width="960" height="400" fill="#fff"/>
  <text x="40" y="44" class="h">하나의 UDR로 여러 appliance에 트래픽 분산</text>
  <rect x="40" y="110" width="220" height="150" rx="8" class="box"/>
  <text x="60" y="148">Source subnet</text>
  <text x="60" y="182" class="d">route table 연결</text>
  <text x="60" y="206" class="d">UDR 1개</text>
  <text x="60" y="230" class="d">VirtualApplianceEcmp</text>
  <rect x="340" y="80" width="250" height="60" rx="8" class="key"/>
  <text x="360" y="117">Appliance 1 (IP 1)</text>
  <rect x="340" y="170" width="250" height="60" rx="8" class="key"/>
  <text x="360" y="207">Appliance 2 (IP 2)</text>
  <rect x="340" y="260" width="250" height="60" rx="8" class="key"/>
  <text x="360" y="297">… Appliance N (최대 16)</text>
  <rect x="690" y="110" width="230" height="150" rx="8" class="box"/>
  <text x="710" y="148">목적지</text>
  <text x="710" y="182" class="d">appliance가 검사·전달</text>
  <path d="M260 185L330 110" class="f"/>
  <path d="M260 185H330" class="f"/>
  <path d="M260 185L330 290" class="f"/>
  <path d="M590 110L680 185" class="f"/>
  <path d="M590 200L680 190" class="f"/>
  <path d="M590 290L680 195" class="f"/>
  <text x="40" y="366" class="d">ECMP는 appliance별 부하 분산·failover, 세션 상태 동기화, return path 대칭을 보장하지 않음</text>
</svg>
