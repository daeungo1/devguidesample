<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="harness-title harness-desc">
  <title id="harness-title">VS Code에서 구성하고 Foundry에서 실행하는 Copilot harness</title>
  <desc id="harness-desc">VS Code에서 prompt agent를 구성해 Foundry version으로 배포한다. 애플리케이션은 agent endpoint로 호출하고, Foundry가 conversation별 workspace와 도구 실행을 조율한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#64748b"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#172554;font-size:20px}.name{font-size:23px;font-weight:600}.note{font-size:18px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="400" fill="#fff"/>
  <text x="40" y="44" class="name">개발 정의와 관리형 runtime의 분리</text>
  <path d="M280 148H360" class="edge"/>
  <path d="M620 148H688" class="edge"/>
  <path d="M500 288V228" class="edge"/>
  <rect x="40" y="88" width="240" height="140" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="160" y="124" text-anchor="middle" class="name">VS Code</text>
  <text x="160" y="164" text-anchor="middle">Agent Builder·YAML</text>
  <text x="160" y="200" text-anchor="middle">model·tools·skills</text>
  <rect x="360" y="88" width="260" height="140" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="490" y="124" text-anchor="middle" class="name">Foundry prompt agent</text>
  <text x="490" y="164" text-anchor="middle">저장된 version</text>
  <text x="490" y="200" text-anchor="middle">Copilot harness</text>
  <rect x="688" y="88" width="232" height="140" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="804" y="124" text-anchor="middle" class="name">Conversation</text>
  <text x="804" y="164" text-anchor="middle">독립 workspace</text>
  <text x="804" y="200" text-anchor="middle">파일·명령·도구 실행</text>
  <rect x="360" y="288" width="260" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="490" y="328" text-anchor="middle">앱 → agent endpoint</text>
  <text x="40" y="384" class="note">Runtime은 Foundry가 운영 · 중요한 결과물은 별도 영속 저장 · Foundry Memory와 구분</text>
</svg>
