<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="eval-title eval-desc">
  <title id="eval-title">Conversation 전체를 평가하는 Foundry 실행 흐름</title>
  <desc id="eval-desc">전체 messages와 도구 정의를 JSONL에 준비한 뒤 conversation 평가를 명시한다. 지원 evaluator가 문제 해결, 만족도, 일관성, 근거와 도구 사용을 평가하며 미지원 evaluator는 건너뛴다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#64748b"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#172554;font-size:20px}.name{font-size:23px;font-weight:600}.note{font-size:18px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="360" fill="#fff"/>
  <text x="40" y="48" class="name">마지막 답변만이 아니라 문제 해결까지의 대화를 평가</text>
  <path d="M280 176H352" class="edge"/>
  <path d="M600 176H672" class="edge"/>
  <rect x="40" y="104" width="240" height="144" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="160" y="144" text-anchor="middle" class="name">Conversation JSONL</text>
  <text x="160" y="184" text-anchor="middle">전체 messages</text>
  <text x="160" y="220" text-anchor="middle">tool calls·definitions</text>
  <rect x="352" y="104" width="248" height="144" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="476" y="144" text-anchor="middle" class="name">Evaluation run</text>
  <text x="476" y="184" text-anchor="middle">evaluation_level</text>
  <text x="476" y="220" text-anchor="middle">= conversation</text>
  <rect x="672" y="104" width="248" height="144" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="796" y="144" text-anchor="middle" class="name">호환 evaluator</text>
  <text x="796" y="184" text-anchor="middle">문제 해결·만족도</text>
  <text x="796" y="220" text-anchor="middle">일관성·근거·도구 품질</text>
  <path d="M40 280H920" stroke="#cbd5e1"/>
  <text x="40" y="316" class="note">기본 평가 수준은 turn · conversation 미지원 evaluator는 건너뜀 → 결과 생성 여부 확인</text>
</svg>
