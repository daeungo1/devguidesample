<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="fwc-title fwc-desc">
  <title id="fwc-title">Kubernetes 정책 반영과 Pod egress의 실제 경로</title>
  <desc id="fwc-desc">SecurityPolicy와 Attachment를 Controller가 Azure Firewall Policy로 반영한다. 별도로 Pod IP를 유지한 IPv4 egress가 준비된 UDR을 따라 Azure Firewall을 거쳐 목적지로 이동해야 정책이 적용된다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#64748b"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#2563eb"/></marker>
    <style>text{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#172554;font-size:20px}.name{font-size:23px;font-weight:600}.note{font-size:18px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.traffic{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow-accent)}</style>
  </defs>
  <rect width="960" height="480" fill="#fff"/>
  <text x="40" y="44" class="name">설정 전달만으로 packet 경로가 만들어지지는 않음</text>
  <path d="M320 148H392" class="edge" stroke-dasharray="6 4"/>
  <path d="M592 148H656" class="edge" stroke-dasharray="6 4"/>
  <path d="M784 212V280" class="edge" stroke-dasharray="6 4"/>
  <path d="M240 336H328" class="traffic"/>
  <path d="M528 336H656" class="traffic"/>
  <rect x="40" y="88" width="280" height="124" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="180" y="124" text-anchor="middle" class="name">Kubernetes 정책</text>
  <text x="180" y="160" text-anchor="middle">SecurityPolicy</text>
  <text x="180" y="192" text-anchor="middle">SecurityPolicyAttachment</text>
  <rect x="392" y="88" width="200" height="124" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="492" y="132" text-anchor="middle" class="name">Controller</text>
  <text x="492" y="176" text-anchor="middle">선택자·규칙 반영</text>
  <rect x="656" y="88" width="264" height="124" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="788" y="132" text-anchor="middle" class="name">Azure Firewall Policy</text>
  <text x="788" y="176" text-anchor="middle">child policy 구성</text>
  <rect x="40" y="280" width="200" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="140" y="320" text-anchor="middle" class="name">선택된 Pod</text>
  <text x="140" y="360" text-anchor="middle">source Pod IP 유지</text>
  <rect x="328" y="280" width="200" height="112" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="428" y="320" text-anchor="middle" class="name">AKS egress 경로</text>
  <text x="428" y="360" text-anchor="middle">UDR 사전 구성</text>
  <rect x="656" y="280" width="264" height="112" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="788" y="320" text-anchor="middle" class="name">Azure Firewall</text>
  <text x="788" y="360" text-anchor="middle">검사·허용/차단 → 목적지</text>
  <path d="M40 416H920" stroke="#cbd5e1"/>
  <text x="40" y="452" class="note">점선: 정책 반영 · 파란 실선: IPv4 Pod egress · Azure CNI Overlay 미지원</text>
</svg>
