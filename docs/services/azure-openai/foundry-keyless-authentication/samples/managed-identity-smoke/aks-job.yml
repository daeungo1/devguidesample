apiVersion: batch/v1
kind: Job
metadata:
  name: foundry-keyless-smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: foundry-smoke
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: smoke
          image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
          command:
            - /bin/sh
            - -ec
            - |
              python -m pip install --disable-pip-version-check --quiet -r /sample/requirements.txt
              exec python /sample/smoke.py --workload-identity
          envFrom:
            - configMapRef:
                name: foundry-smoke-settings
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: sample
              mountPath: /sample
              readOnly: true
      volumes:
        - name: sample
          configMap:
            name: foundry-smoke-code
