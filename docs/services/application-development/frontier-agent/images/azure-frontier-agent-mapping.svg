<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Frontier Agent 패턴의 Azure 매핑</title>
  <desc id="desc">채널, Foundry hosted agent 실행 환경, 직접 구축하는 제어면, 도구와 리소스, 관측과 거버넌스 계층으로 구성한 Azure 기반 상시 동작형 에이전트 참조 구성. 파란색은 플랫폼이 제공하는 구성 요소, 주황색은 직접 설계해야 하는 구성 요소다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #111827; }
      .h { font-size: 17px; font-weight: 700; }
      .b { font-size: 14px; font-weight: 600; }
      .s { font-size: 12px; fill: #374151; }
      .n { font-size: 12px; fill: #6b7280; }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="640" fill="#ffffff"/>

  <!-- legend -->
  <rect x="20" y="16" width="18" height="14" rx="3" fill="#eef4ff" stroke="#3b6fd8"/>
  <text x="46" y="28" class="s">플랫폼 제공</text>
  <rect x="140" y="16" width="18" height="14" rx="3" fill="#fff4e5" stroke="#d9822b" stroke-dasharray="4 3"/>
  <text x="166" y="28" class="s">직접 설계·구축</text>

  <!-- channels -->
  <rect x="20" y="60" width="170" height="420" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="105" y="90" class="h" text-anchor="middle">진입점</text>
  <text x="105" y="130" class="b" text-anchor="middle">Teams · M365</text>
  <text x="105" y="150" class="s" text-anchor="middle">Activity 프로토콜</text>
  <text x="105" y="195" class="b" text-anchor="middle">자체 앱</text>
  <text x="105" y="215" class="s" text-anchor="middle">Responses 프로토콜</text>
  <text x="105" y="260" class="b" text-anchor="middle">Webhook · 음성</text>
  <text x="105" y="280" class="s" text-anchor="middle">Invocations (HTTP·WS)</text>
  <text x="105" y="325" class="b" text-anchor="middle">Routine 트리거</text>
  <text x="105" y="345" class="s" text-anchor="middle">schedule · timer</text>
  <text x="105" y="363" class="s" text-anchor="middle">GitHub issue · Teams</text>
  <text x="105" y="410" class="n" text-anchor="middle">승인 카드는</text>
  <text x="105" y="428" class="n" text-anchor="middle">채널 UI에서 처리</text>

  <!-- hosted agent -->
  <rect x="220" y="60" width="370" height="420" rx="12" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="405" y="88" class="h" text-anchor="middle">Foundry hosted agent</text>
  <text x="405" y="106" class="n" text-anchor="middle">세션별 VM 격리 sandbox</text>

  <rect x="240" y="120" width="160" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="320" y="150" class="b" text-anchor="middle">에이전트 코드</text>
  <text x="320" y="172" class="s" text-anchor="middle">Agent Framework 등</text>

  <rect x="410" y="120" width="160" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="490" y="150" class="b" text-anchor="middle">$HOME · /files</text>
  <text x="490" y="172" class="s" text-anchor="middle">세션 재개 시 복원</text>

  <rect x="240" y="207" width="160" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="320" y="237" class="b" text-anchor="middle">State store</text>
  <text x="320" y="259" class="s" text-anchor="middle">키-값 애플리케이션 상태</text>

  <rect x="410" y="207" width="160" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="490" y="237" class="b" text-anchor="middle">Memory (preview)</text>
  <text x="490" y="259" class="s" text-anchor="middle">프로필 · 요약 · 절차</text>

  <rect x="240" y="294" width="160" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="320" y="324" class="b" text-anchor="middle">Reminder (preview)</text>
  <text x="320" y="346" class="s" text-anchor="middle">같은 대화로 재호출</text>

  <rect x="410" y="294" width="160" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="490" y="324" class="b" text-anchor="middle">Agent identity</text>
  <text x="490" y="346" class="s" text-anchor="middle">에이전트별 Entra ID</text>

  <rect x="240" y="381" width="330" height="80" rx="8" fill="#dbe7ff" stroke="#3b6fd8" stroke-dasharray="4 3"/>
  <text x="405" y="412" class="b" text-anchor="middle">Foundry 가드레일 · Prompt Shields</text>
  <text x="405" y="436" class="s" text-anchor="middle">사용자 입력 · 도구 응답에서 document attack 탐지</text>

  <!-- control plane (build) -->
  <rect x="625" y="60" width="270" height="420" rx="12" fill="#fff4e5" stroke="#d9822b" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="760" y="88" class="h" text-anchor="middle">제어면</text>
  <text x="760" y="106" class="n" text-anchor="middle">에이전트 컨테이너 밖에서 집행</text>

  <rect x="645" y="120" width="230" height="78" rx="8" fill="#ffffff" stroke="#d9822b"/>
  <text x="760" y="152" class="b" text-anchor="middle">정책 · 승인 서비스</text>
  <text x="760" y="175" class="s" text-anchor="middle">require_approval 집행 · 등급별 규칙</text>

  <rect x="645" y="208" width="230" height="78" rx="8" fill="#ffffff" stroke="#d9822b"/>
  <text x="760" y="240" class="b" text-anchor="middle">자격 증명 경계</text>
  <text x="760" y="263" class="s" text-anchor="middle">Key Vault 연결 · 토큰 비노출</text>

  <rect x="645" y="296" width="230" height="78" rx="8" fill="#ffffff" stroke="#d9822b"/>
  <text x="760" y="328" class="b" text-anchor="middle">Egress 제어</text>
  <text x="760" y="351" class="s" text-anchor="middle">고객 VNet 경로에서 검사</text>

  <rect x="645" y="384" width="230" height="78" rx="8" fill="#ffffff" stroke="#d9822b"/>
  <text x="760" y="416" class="b" text-anchor="middle">행동 감사 기록</text>
  <text x="760" y="439" class="s" text-anchor="middle">제안 · 승인 · 실행 결과 연결</text>

  <!-- tools and resources -->
  <rect x="925" y="60" width="155" height="420" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1002" y="90" class="h" text-anchor="middle">도구 · 리소스</text>
  <text x="1002" y="130" class="b" text-anchor="middle">Toolbox</text>
  <text x="1002" y="150" class="s" text-anchor="middle">MCP endpoint</text>
  <text x="1002" y="195" class="b" text-anchor="middle">Foundry 모델</text>
  <text x="1002" y="215" class="s" text-anchor="middle">project endpoint</text>
  <text x="1002" y="260" class="b" text-anchor="middle">Azure 리소스</text>
  <text x="1002" y="280" class="s" text-anchor="middle">agent identity RBAC</text>
  <text x="1002" y="325" class="b" text-anchor="middle">외부 SaaS</text>
  <text x="1002" y="345" class="s" text-anchor="middle">OAuth passthrough</text>
  <text x="1002" y="390" class="b" text-anchor="middle">화면 조작 (preview)</text>
  <text x="1002" y="410" class="s" text-anchor="middle">Browser Automation</text>
  <text x="1002" y="428" class="s" text-anchor="middle">computer use</text>

  <!-- arrows -->
  <line x1="192" y1="270" x2="218" y2="270" stroke="#374151" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="592" y1="270" x2="623" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="607" y="258" class="n" text-anchor="middle">제안</text>
  <line x1="897" y1="270" x2="923" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M760,60 L760,44 L105,44 L105,58" fill="none" stroke="#d9822b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="560" y="38" class="s" text-anchor="middle">승인 요청</text>

  <!-- governance -->
  <rect x="20" y="510" width="1060" height="108" rx="10" fill="#eefbf1" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="550" y="538" class="h" text-anchor="middle">관측과 거버넌스</text>
  <text x="200" y="572" class="b" text-anchor="middle">Application Insights</text>
  <text x="200" y="594" class="s" text-anchor="middle">OpenTelemetry trace 자동 연결</text>
  <text x="550" y="572" class="b" text-anchor="middle">Microsoft Entra Agent ID</text>
  <text x="550" y="594" class="s" text-anchor="middle">에이전트 신원 · OAuth · OIDC</text>
  <text x="900" y="572" class="b" text-anchor="middle">Microsoft Agent 365</text>
  <text x="900" y="594" class="s" text-anchor="middle">registry · Entra · Purview · Defender</text>
</svg>
