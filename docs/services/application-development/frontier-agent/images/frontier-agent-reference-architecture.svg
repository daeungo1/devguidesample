<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">Frontier Agent 공통 참조 아키텍처</title>
  <desc id="desc">사용자 채널, 격리된 에이전트 실행 환경, 에이전트가 변경할 수 없는 제어면, 연결된 앱과 웹, 그리고 투명성 계층으로 구성된 상시 동작형 에이전트의 공통 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #111827; }
      .h { font-size: 17px; font-weight: 700; }
      .b { font-size: 14px; font-weight: 600; }
      .s { font-size: 12px; fill: #374151; }
      .n { font-size: 12px; fill: #6b7280; }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="610" fill="#ffffff"/>

  <!-- approval path -->
  <path d="M770,60 L770,32 L105,32 L105,148" fill="none" stroke="#d9822b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="438" y="24" class="s" text-anchor="middle">승인·확인 요청은 대화와 분리된 결정적 UI로 사용자에게 전달</text>

  <!-- channels -->
  <rect x="20" y="150" width="170" height="260" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="105" y="180" class="h" text-anchor="middle">사용자 채널</text>
  <text x="105" y="215" class="s" text-anchor="middle">ChatGPT · Muse 앱</text>
  <text x="105" y="240" class="s" text-anchor="middle">Slack · Teams</text>
  <text x="105" y="265" class="s" text-anchor="middle">WhatsApp · 모바일</text>
  <text x="105" y="290" class="s" text-anchor="middle">음성 통화</text>
  <text x="105" y="330" class="n" text-anchor="middle">채널이 달라도</text>
  <text x="105" y="348" class="n" text-anchor="middle">같은 맥락을 유지</text>

  <!-- runtime -->
  <rect x="220" y="60" width="385" height="420" rx="12" fill="#eef4ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="412" y="88" class="h" text-anchor="middle">에이전트 실행 환경</text>
  <text x="412" y="106" class="n" text-anchor="middle">사용자별 격리된 전용 클라우드 컴퓨터</text>

  <rect x="240" y="120" width="165" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="322" y="150" class="b" text-anchor="middle">Harness + 모델</text>
  <text x="322" y="172" class="s" text-anchor="middle">계획·실행 루프</text>

  <rect x="420" y="120" width="165" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="502" y="150" class="b" text-anchor="middle">Sub-agent</text>
  <text x="502" y="172" class="s" text-anchor="middle">위임·병렬 작업</text>

  <rect x="240" y="207" width="165" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="322" y="237" class="b" text-anchor="middle">브라우저</text>
  <text x="322" y="259" class="s" text-anchor="middle">탐색·폼 입력·구매</text>

  <rect x="420" y="207" width="165" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="502" y="237" class="b" text-anchor="middle">파일 · 메모리</text>
  <text x="502" y="259" class="s" text-anchor="middle">세션을 넘는 지속 상태</text>

  <rect x="240" y="294" width="165" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="322" y="324" class="b" text-anchor="middle">도구 · CLI · Skill</text>
  <text x="322" y="346" class="s" text-anchor="middle">필요하면 도구를 직접 작성</text>

  <rect x="420" y="294" width="165" height="72" rx="8" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="502" y="324" class="b" text-anchor="middle">스케줄러</text>
  <text x="502" y="346" class="s" text-anchor="middle">백그라운드·선제 조사</text>

  <rect x="240" y="381" width="345" height="80" rx="8" fill="#dbe7ff" stroke="#3b6fd8" stroke-dasharray="4 3"/>
  <text x="412" y="412" class="b" text-anchor="middle">격리 경계</text>
  <text x="412" y="436" class="s" text-anchor="middle">샌드박스 · 권한 축소 · 사용자 간 분리 · 외부 데이터는 비신뢰로 표시</text>

  <!-- control plane -->
  <rect x="640" y="60" width="260" height="420" rx="12" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
  <text x="770" y="88" class="h" text-anchor="middle">제어면</text>
  <text x="770" y="106" class="n" text-anchor="middle">에이전트가 변경하거나 끌 수 없음</text>

  <rect x="660" y="120" width="220" height="78" rx="8" fill="#ffffff" stroke="#d9822b"/>
  <text x="770" y="152" class="b" text-anchor="middle">행동 정책 · 승인</text>
  <text x="770" y="175" class="s" text-anchor="middle">dots Auto-review · Muse Sentinel</text>

  <rect x="660" y="208" width="220" height="78" rx="8" fill="#ffffff" stroke="#d9822b"/>
  <text x="770" y="240" class="b" text-anchor="middle">자격 증명 브로커</text>
  <text x="770" y="263" class="s" text-anchor="middle">모델에 비밀을 노출하지 않음</text>

  <rect x="660" y="296" width="220" height="78" rx="8" fill="#ffffff" stroke="#d9822b"/>
  <text x="770" y="328" class="b" text-anchor="middle">안전 모니터 · 분류기</text>
  <text x="770" y="351" class="s" text-anchor="middle">prompt injection · 이상 행동</text>

  <rect x="660" y="384" width="220" height="78" rx="8" fill="#ffffff" stroke="#d9822b"/>
  <text x="770" y="416" class="b" text-anchor="middle">Egress 게이트웨이</text>
  <text x="770" y="439" class="s" text-anchor="middle">목적지·데이터 흐름 검사</text>

  <!-- apps -->
  <rect x="930" y="150" width="150" height="260" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1005" y="180" class="h" text-anchor="middle">연결된 앱 · 웹</text>
  <text x="1005" y="215" class="s" text-anchor="middle">이메일 · 캘린더</text>
  <text x="1005" y="240" class="s" text-anchor="middle">업무 앱 · Plugin</text>
  <text x="1005" y="265" class="s" text-anchor="middle">기록 시스템</text>
  <text x="1005" y="290" class="s" text-anchor="middle">웹 사이트 · 결제</text>
  <text x="1005" y="330" class="n" text-anchor="middle">읽기와 쓰기 권한을</text>
  <text x="1005" y="348" class="n" text-anchor="middle">분리해 부여</text>

  <!-- arrows -->
  <line x1="192" y1="280" x2="218" y2="280" stroke="#374151" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="607" y1="270" x2="638" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="622" y="258" class="n" text-anchor="middle">제안</text>
  <line x1="902" y1="280" x2="928" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- transparency layer -->
  <rect x="20" y="510" width="1060" height="78" rx="10" fill="#eefbf1" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="550" y="540" class="h" text-anchor="middle">투명성과 사용자 통제</text>
  <text x="550" y="566" class="s" text-anchor="middle">활동 로그 · 감사 추적 · 목표와 진행 상황 · 열람·편집 가능한 메모리 · 사용자 정의 규칙 · 언제든 중단·방향 전환</text>
</svg>
